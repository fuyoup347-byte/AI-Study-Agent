services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /data/study_agent.sqlite3
    volumes:
      - study_agent_data:/data
    expose:
      - "8000"
  caddy:
    image: caddy:2
    restart: unless-stopped
    command: ["caddy", "reverse-proxy", "--from", "${APP_DOMAIN}", "--to", "api:8000"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  study_agent_data:
  caddy_data:
  caddy_config:
